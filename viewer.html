<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DB Viewer</title>
  <link rel="stylesheet" href="shared.css">
  <script src="shared.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body>
  <div class="nav">
    <a href="index.html">ERD Canvas</a>
    <a href="schema.html">Schema / Mermaid</a>
    <a href="sandbox.html">SQL Sandbox</a>
    <a class="active" href="viewer.html">DB Viewer</a>
  </div>

  <div class="copyright-badge">© Mike Pangburn 2025</div>

  <div style="display:flex; gap:16px; padding:16px;">
    <div style="width:260px;">
      <h2 style="margin-top:0;">DB Viewer</h2>
      <select id="viewer-table-list" style="width:100%;">
        <option value="">-- Select Table --</option>
      </select>
      <div id="viewer-status" class="message-box" style="margin-top:10px;"></div>
    </div>

    <div style="flex:1; min-width:0;">
      <div id="viewer-table-wrap"
           style="overflow:auto; max-height: calc(100vh - 140px); border:1px solid var(--border); border-radius:12px; padding:10px;">
        <div class="muted">Select a table to view it.</div>
      </div>
    </div>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
